name: Pixel-loop emulator stress

# Real producer -> Termux terminal session -> parser -> renderer evidence.
# Manual-only: this is intentionally separate from ordinary APK/render smoke.

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Producer run duration"
        required: false
        default: "20"
        type: string
      fit_mode:
        description: "Fit mode: width, height, or fill (fill stretches the pixel grid across the whole terminal)"
        required: false
        default: "fill"
        type: choice
        options:
          - fill
          - width
          - height
      fps:
        description: "Frame rate override (GIF native ~12fps when unset)"
        required: false
        default: "60"
        type: string
      rendering_mode:
        description: "Terminal rendering mode"
        required: false
        default: "system"
        type: choice
        options:
          - system
          - hwui_gpu

env:
  JAVA_VERSION: 21
  BUNDLETOOL_VERSION: 1.18.2
  PIXEL_LOOP_ASSET: pixel-loop-x86_64

jobs:
  pixel-loop-stress:
    name: x86_64 emulator pixel-loop stress
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Record runner spec
        run: |
          set -eux
          nproc
          free -h | head -2
          ls -la /dev/kvm

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Install Android SDK pieces
        run: |
          set -euxo pipefail
          SDK="$ANDROID_HOME"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;34.0.0" "platform-tools" \
            "emulator" "system-images;android-36;google_apis;x86_64" >/dev/null
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build installable fused debug APK from AAB
        env:
          KS_PASSWORD: xrj45yWGLbsO7W0v
        run: |
          set -euxo pipefail
          ./gradlew bundleDebug --no-daemon --console=plain
          test -s app/build/outputs/bundle/debug/app-debug.aab
          curl --fail --location --retry 3 \
            -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          test -s bundletool.jar
          java -jar bundletool.jar build-apks \
            --bundle=app/build/outputs/bundle/debug/app-debug.aab \
            --output=termux-app-debug-universal.apks \
            --mode=universal \
            --ks=app/testkey_untrusted.jks \
            --ks-key-alias=alias \
            --ks-pass=pass:${KS_PASSWORD} \
            --key-pass=pass:${KS_PASSWORD}
          unzip -t termux-app-debug-universal.apks
          mkdir -p debug-universal
          unzip -o termux-app-debug-universal.apks universal.apk -d debug-universal
          test -s debug-universal/universal.apk
          sha256sum app/build/outputs/bundle/debug/app-debug.aab \
            debug-universal/universal.apk | tee debug-artifacts.sha256

      - name: Download and verify x86_64 producer from latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          PIXEL_LOOP_PATH=$(python3 .github/workflows/fetch_pixel_loop_release.py \
            --asset "$PIXEL_LOOP_ASSET" --out-dir .)
          echo "PIXEL_LOOP_PATH=$PIXEL_LOOP_PATH" >> "$GITHUB_ENV"
          chmod 755 "$PIXEL_LOOP_PATH"
          file "$PIXEL_LOOP_ASSET" | tee pixel-loop-file.txt
          readelf -d "$PIXEL_LOOP_ASSET" | tee pixel-loop-dynamic.txt
          grep -q 'x86-64' pixel-loop-file.txt
          # The interpreter is a program header (readelf -l, "Requesting program
          # interpreter:"); readelf -d (dynamic section) never prints it.
          readelf -l "$PIXEL_LOOP_ASSET" | grep -q 'Requesting program interpreter: /system/bin/linker64'
          test -x "$PIXEL_LOOP_ASSET"

      - name: Create and boot x86_64 emulator
        env:
          ANDROID_AVD_HOME: /home/runner/.android/avd
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n pixel-loop-stress --package "system-images;android-36;google_apis;x86_64" --device pixel_5
          test -f "$ANDROID_AVD_HOME/pixel-loop-stress.ini"
          "$ANDROID_HOME/emulator/emulator" -avd pixel-loop-stress \
            -gpu swiftshader_indirect -no-window -no-audio -no-boot-anim \
            -no-snapshot -wipe-data -memory 3072 -cores 3 \
            > /tmp/pixel-loop-emu.log 2>&1 &
          for i in $(seq 1 15); do
            sleep 60
            boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "[boot-wait minute $i] sys.boot_completed='$boot'"
            if [ "$boot" = 1 ]; then break; fi
            pgrep -f 'emulator.*-avd pixel-loop-stress' >/dev/null || { tail -80 /tmp/pixel-loop-emu.log; exit 43; }
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell getprop ro.product.cpu.abi
          adb shell getprop ro.hardware.egl

      - name: Install Termux and stage producer inside app UID
        run: |
          set -euxo pipefail
          adb install -r debug-universal/universal.apk
          adb shell am start -W -n com.termux/.app.TermuxActivity
          for i in $(seq 1 24); do
            if adb shell run-as com.termux test -x /data/data/com.termux/files/usr/bin/sh; then
              echo "TERMUX_PREFIX_READY_AFTER_${i}0_SECONDS=1"
              break
            fi
            echo "[termux-bootstrap-wait] prefix not ready at ${i}0s"
            sleep 10
          done
          adb shell run-as com.termux test -x /data/data/com.termux/files/usr/bin/sh
          adb push "$PIXEL_LOOP_ASSET" /data/local/tmp/$PIXEL_LOOP_ASSET
          adb shell run-as com.termux mkdir -p /data/data/com.termux/files/usr/tmp
          adb shell run-as com.termux cp /data/local/tmp/$PIXEL_LOOP_ASSET /data/data/com.termux/files/usr/tmp/$PIXEL_LOOP_ASSET
          adb shell run-as com.termux chmod 755 /data/data/com.termux/files/usr/tmp/$PIXEL_LOOP_ASSET
          adb shell run-as com.termux sha256sum /data/data/com.termux/files/usr/tmp/$PIXEL_LOOP_ASSET

      - name: Select rendering mode
        if: inputs.rendering_mode == 'hwui_gpu'
        run: |
          set -euxo pipefail
          cat > /tmp/termux_prefs.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8" standalone="yes" ?>
          <map>
              <string name="terminal_rendering_mode">hwui_gpu</string>
          </map>
          EOF
          adb push /tmp/termux_prefs.xml /data/local/tmp/termux_prefs.xml
          adb shell run-as com.termux mkdir -p shared_prefs
          adb shell run-as com.termux cp /data/local/tmp/termux_prefs.xml shared_prefs/com.termux_preferences.xml
          adb shell am force-stop com.termux
          adb shell am start -W -n com.termux/.app.TermuxActivity
          for i in $(seq 1 24); do
            if adb shell run-as com.termux test -x /data/data/com.termux/files/usr/bin/sh; then break; fi
            sleep 5
          done
          adb shell run-as com.termux test -x /data/data/com.termux/files/usr/bin/sh

      - name: Run producer through the real Termux terminal session
        env:
          DURATION: ${{ inputs.duration_seconds }}
          FIT_MODE: ${{ inputs.fit_mode }}
          FPS: ${{ inputs.fps }}
          RENDERING_MODE: ${{ inputs.rendering_mode }}
        run: |
          set -euxo pipefail
          PRODUCER=/data/data/com.termux/files/usr/tmp/$PIXEL_LOOP_ASSET
          # Discard bootstrap/startup frames. The stress window must measure
          # producer -> PTY -> parser -> renderer, not app launch noise.
          adb shell dumpsys gfxinfo com.termux reset
          TERMUX_PID=$(adb shell pidof com.termux | tr -d '\r' | awk '{print $1}')
          test -n "$TERMUX_PID"
          adb shell atrace --async_start -b 8192 -a com.termux gfx view sched freq idle \
            > atrace-start.txt 2>&1
          adb shell input text "$PRODUCER --fit $FIT_MODE --fps $FPS"
          adb shell input keyevent KEYCODE_ENTER
          start=$(date +%s)
          date -Is > host-time-start.txt
          adb shell 'date +"%Y-%m-%dT%H:%M:%S.%3N%z"' > device-time-start.txt
          adb shell dumpsys package com.termux | grep -E 'versionCode|versionName|lastUpdateTime|codePath' > package-running.txt || true
          (
            for sample in $(seq 1 "$DURATION"); do
              echo "===== SAMPLE $sample ====="
              adb shell top -H -b -n 1 -p "$TERMUX_PID"
              sleep 1
            done
          ) > top-thread-samples.txt 2>&1 &
          sampler_pid=$!
          sleep "$DURATION"
          wait "$sampler_pid" || true
          adb shell atrace --async_stop > atrace.txt 2>&1
          end=$(date +%s)
          date -Is > host-time-running.txt
          adb shell 'date +"%Y-%m-%dT%H:%M:%S.%3N%z"' > device-time-running.txt
          echo "PRODUCER_REQUESTED_SECONDS=$DURATION" | tee stress-metrics.txt
          echo "PRODUCER_FIT_MODE=$FIT_MODE" | tee -a stress-metrics.txt
          echo "PRODUCER_FPS=$FPS" | tee -a stress-metrics.txt
          echo "PRODUCER_RENDERING_MODE=$RENDERING_MODE" | tee -a stress-metrics.txt
          echo "PRODUCER_WALL_SECONDS=$((end-start))" | tee -a stress-metrics.txt
          adb exec-out screencap -p > pixel-loop-running.png
          adb shell ps -A | grep -E 'com.termux|pixel-loop' | tee -a stress-metrics.txt || true
          adb shell dumpsys gfxinfo com.termux > gfxinfo-running.txt
          adb shell dumpsys meminfo com.termux > meminfo-running.txt
          adb logcat -d > logcat-running.txt
          adb shell input keyevent KEYCODE_CTRL_LEFT || true
          adb shell input keyevent KEYCODE_C || true
          sleep 3
          adb exec-out screencap -p > pixel-loop-after-stop.png

      - name: Collect terminal stress evidence
        if: always()
        run: |
          set +e
          adb shell dumpsys gfxinfo com.termux > gfxinfo-final.txt
          adb shell dumpsys meminfo com.termux > meminfo-final.txt
          adb shell ps -A > processes-final.txt
          adb logcat -d > logcat-final.txt
          adb shell dumpsys activity activities > activity-final.txt
          python3 scripts/parse_meminfo.py meminfo-running.txt meminfo-final.txt --json meminfo-summary.json
          python3 scripts/parse_gfxinfo.py gfxinfo-final.txt gfxinfo-summary.json
          grep -iE 'FATAL EXCEPTION|AndroidRuntime|Termux|TerminalView|frame rev=|published=|lastDrawnRev=' logcat-final.txt | tail -200 > terminal-log-summary.txt
          {
            echo '== producer hash inside app UID =='
            adb shell run-as com.termux sha256sum /data/data/com.termux/files/usr/tmp/$PIXEL_LOOP_ASSET
            echo '== ABI =='
            adb shell getprop ro.product.cpu.abi
            echo '== EGL =='
            adb shell getprop ro.hardware.egl
            echo '== stress metric files =='
            cat stress-metrics.txt 2>/dev/null
          } > stress-evidence.txt

      - name: Require non-empty structured stress evidence
        run: |
          set -euo pipefail
          test -s meminfo-running.txt
          test -s meminfo-final.txt
          test -s gfxinfo-final.txt
          test -s top-thread-samples.txt
          test -s atrace.txt
          grep -Eq 'RenderThread|TermSessionParserWorker' top-thread-samples.txt
          python3 scripts/parse_meminfo.py meminfo-running.txt meminfo-final.txt --json meminfo-summary.json
          python3 scripts/parse_gfxinfo.py gfxinfo-final.txt gfxinfo-summary.json
          grep -Eq '"total_pss_kb": [1-9][0-9]*' meminfo-summary.json
          grep -Eq '"total_frames_rendered": [1-9][0-9]*' gfxinfo-summary.json
          grep -Eq '"janky_frames": [0-9]+' gfxinfo-summary.json

      - name: Verify frame metrics invariants
        run: |
          set -euo pipefail
          echo '== frame metric invariant check (all lines) =='
          python3 .github/workflows/verify_frame_metrics.py terminal-log-summary.txt --min-lines 1

      - name: Publish lightweight stress summary
        if: always()
        run: |
          {
            echo '## Pixel-loop emulator stress summary'
            echo
            echo '### Producer and runtime identity'
            cat stress-evidence.txt 2>/dev/null || true
            echo
            echo '### Requested workload'
            cat stress-metrics.txt 2>/dev/null || true
            echo
            echo '### Memory summary'
            cat meminfo-summary.json 2>/dev/null || true
            echo
            echo '### Graphics summary'
            cat gfxinfo-summary.json 2>/dev/null || true
            echo
            echo '### Frame metrics'
            cat terminal-log-summary.txt 2>/dev/null || true
          } | tee emulator-stress-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lightweight stress summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pixel-loop-stress-summary-x86_64
          path: |
            pixel-loop-file.txt
            pixel-loop-dynamic.txt
            debug-artifacts.sha256
            package-running.txt
            stress-metrics.txt
            stress-evidence.txt
            meminfo-summary.json
            gfxinfo-summary.json
            terminal-log-summary.txt
            emulator-stress-summary.txt
          if-no-files-found: warn

      - name: Upload full pixel-loop stress evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pixel-loop-stress-evidence-x86_64
          path: |
            pixel-loop-file.txt
            pixel-loop-dynamic.txt
            debug-artifacts.sha256
            app/build/outputs/bundle/debug/app-debug.aab
            debug-universal/universal.apk
            pixel-loop-running.png
            pixel-loop-after-stop.png
            package-running.txt
            host-time-start.txt
            host-time-running.txt
            device-time-start.txt
            device-time-running.txt
            stress-metrics.txt
            stress-evidence.txt
            gfxinfo-running.txt
            gfxinfo-final.txt
            meminfo-running.txt
            meminfo-final.txt
            meminfo-summary.json
            gfxinfo-summary.json
            atrace-start.txt
            atrace.txt
            top-thread-samples.txt
            processes-final.txt
            activity-final.txt
            terminal-log-summary.txt
            logcat-running.txt
            logcat-final.txt
            /tmp/pixel-loop-emu.log
          if-no-files-found: warn

      - name: Kill emulator
        if: always()
        run: adb emu kill || pkill -f qemu-system || true
