name: Terminal stress (pixel-loop)

# This is deliberately separate from render-smoke.yml.
# render-smoke proves that the APK can start and render pixels; this workflow
# drives a real Android arm64 producer through RUN_COMMAND and measures the
# sustained PTY -> parser -> View/render path. It is a stress regression gate,
# not a hosted-runner performance benchmark.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  JAVA_VERSION: 21
  NDK_VERSION: 29.0.14206865

jobs:
  pixel-loop-stress:
    name: Android terminal stress (pixel-loop + SwiftShader)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Android SDK pieces
        run: |
          SDK="$ANDROID_HOME"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;34.0.0" \
            "platform-tools" "emulator" \
            "ndk;${NDK_VERSION}" \
            "system-images;android-36;google_apis;x86_64" >/dev/null
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build Android arm64 and x86_64 pixel-loop producers
        working-directory: tools/pixel-loop
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for target in aarch64-linux-android x86_64-linux-android; do
            export CARGO_TARGET_$(echo "$target" | tr '[:lower:]-' '[:upper:]_')_LINKER="$TOOLCHAIN/${target}24-clang"
            cargo build --release --target "$target"
            file "target/$target/release/pixel-loop"
            test "$(stat -c '%s' "target/$target/release/pixel-loop")" -gt 100000
          done

      - name: Boot emulator with SwiftShader
        env:
          ANDROID_AVD_HOME: /home/runner/.android/avd
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n pixel-loop-stress --package "system-images;android-36;google_apis;x86_64" --device pixel_5
          nohup "$ANDROID_HOME/emulator/emulator" -avd pixel-loop-stress \
            -gpu swiftshader_indirect -no-window -no-audio -no-boot-anim \
            -no-snapshot -wipe-data -memory 3072 -cores 3 \
            > /tmp/pixel-loop-emu.log 2>&1 &
          for i in $(seq 1 15); do
            sleep 60
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "[boot-wait minute $i] sys.boot_completed='$BOOT'"
            [ "$BOOT" = "1" ] && break
            pgrep -f "emulator.*-avd pixel-loop-stress" >/dev/null || { tail -50 /tmp/pixel-loop-emu.log; exit 43; }
          done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]

      - name: Install APK and pixel-loop into the Termux user environment
        run: |
          APK=$(ls app/build/outputs/apk/debug/termux-app_*universal*.apk 2>/dev/null || ls app/build/outputs/apk/debug/termux-app_*x86_64*.apk)
          adb install -r "$APK"
          adb shell am start -W -n com.termux/.app.TermuxActivity
          sleep 10
          adb push tools/pixel-loop/target/x86_64-linux-android/release/pixel-loop /data/local/tmp/pixel-loop
          adb shell run-as com.termux sh -c 'mkdir -p files/usr/bin files/home/.termux && cp /data/local/tmp/pixel-loop files/usr/bin/pixel-loop && chmod 755 files/usr/bin/pixel-loop && printf "allow-external-apps=true\n" > files/home/.termux/termux.properties'

      - name: Run sustained pixel-loop through RUN_COMMAND
        run: |
          set -o pipefail
          adb shell dumpsys gfxinfo com.termux reset > gfxinfo_before.txt
          adb shell am startservice \
            -n com.termux/.app.RunCommandService \
            -a com.termux.RUN_COMMAND \
            --es com.termux.RUN_COMMAND_PATH /data/data/com.termux/files/usr/bin/pixel-loop \
            --ez com.termux.RUN_COMMAND_BACKGROUND false \
            --es com.termux.RUN_COMMAND_COMMAND_LABEL pixel-loop-stress \
            > run-command-start.txt 2>&1
          sleep 20
          adb shell pidof pixel-loop || true
          adb shell input keyevent KEYCODE_Q || true
          sleep 3
          adb shell dumpsys gfxinfo com.termux > gfxinfo_after.txt
          adb logcat -d -v threadtime > pixel-loop-logcat.txt
          adb shell dumpsys activity activities > pixel-loop-activities.txt
          adb shell dumpsys meminfo com.termux > pixel-loop-meminfo.txt
          grep -iE 'FATAL|AndroidRuntime|pixel-loop|OutOfMemory' pixel-loop-logcat.txt | tail -80 || true
          grep -E 'Janky frames|Total frames rendered|Slow UI thread|Slow bitmap uploads' gfxinfo_after.txt || true

      - name: Upload pixel-loop stress evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pixel-loop-stress-evidence
          path: |
            gfxinfo_before.txt
            gfxinfo_after.txt
            pixel-loop-logcat.txt
            pixel-loop-activities.txt
            pixel-loop-meminfo.txt
            run-command-start.txt
            /tmp/pixel-loop-emu.log

      - name: Kill emulator
        if: always()
        run: adb emu kill || pkill -f qemu-system || true