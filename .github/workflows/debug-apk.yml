# Debug APK build for on-device acceptance testing.
# Produces app-debug.apk as an artifact; installed on real devices
# (e.g. pandora) via `su -c pm install`. Not a release channel.
name: Debug APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: assembleDebug (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Build debug APK
        run: |
          sh gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Record APK metadata
        run: |
          ls -la app/build/outputs/apk/debug/
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee -a "$GITHUB_STEP_SUMMARY"
