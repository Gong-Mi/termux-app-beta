name: Build pixel-loop x86_64 prebuilt

on:
  push:
    branches: [ ci/pixel-loop-terminal-stress ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x86_64:
    name: Build standalone Android x86_64 pixel-loop ELF
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Install Android NDK
        run: |
          set -euxo pipefail
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses >/dev/null || true
          "$SDK" "platforms;android-36" "ndk;29.0.14206865" >/dev/null

      - name: Restore build-only producer source from its original commit
        run: |
          set -euxo pipefail
          git checkout dcdb67ba33642917d3f6be625c46765c3446bdc5 -- tools/pixel-loop
          test -f tools/pixel-loop/src/main.rs
          test -f tools/pixel-loop/assets/video-pixel-loop.gif

      - name: Build only x86_64 producer
        working-directory: tools/pixel-loop
        run: |
          set -euxo pipefail
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TOOLCHAIN/x86_64-linux-android24-clang"
          cargo build --release --target x86_64-linux-android
          cp target/x86_64-linux-android/release/pixel-loop "$GITHUB_WORKSPACE/pixel-loop-x86_64"
          chmod 755 "$GITHUB_WORKSPACE/pixel-loop-x86_64"
          file "$GITHUB_WORKSPACE/pixel-loop-x86_64"
          sha256sum "$GITHUB_WORKSPACE/pixel-loop-x86_64" | tee "$GITHUB_WORKSPACE/pixel-loop-x86_64.sha256"

      - name: Upload x86_64 Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release upload pixel-loop-085912 \
            pixel-loop-x86_64 \
            pixel-loop-x86_64.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload build evidence
        uses: actions/upload-artifact@v6
        with:
          name: pixel-loop-x86_64-prebuilt-evidence
          path: |
            pixel-loop-x86_64
            pixel-loop-x86_64.sha256
