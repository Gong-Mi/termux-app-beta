# Build a release AAB once, then package and upload the installable target
# separately. The AAB and universal APKS are never mixed in one artifact.
name: Release APKS

on:
  workflow_dispatch:
  push:
    branches: [ build/release-apks ]

permissions:
  contents: read

env:
  JAVA_VERSION: 21
  BUNDLETOOL_VERSION: 1.18.2

jobs:
  build-release-aab:
    name: bundleRelease -> AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Build release Android App Bundle
        run: |
          ./gradlew bundleRelease --no-daemon
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Upload release AAB only
        uses: actions/upload-artifact@v6
        with:
          name: termux-app-release-aab
          if-no-files-found: error
          path: app/build/outputs/bundle/release/app-release.aab

  package-release-universal:
    name: AAB -> signed universal .apks
    needs: build-release-aab
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout signing fixture
        uses: actions/checkout@v6

      - name: Download release AAB
        uses: actions/download-artifact@v6
        with:
          name: termux-app-release-aab
          path: input

      - name: Download bundletool
        run: |
          curl --fail --location --retry 3 \
            -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          test -s bundletool.jar
          sha256sum bundletool.jar | tee bundletool.sha256

      - name: Build and verify signed universal release APKS
        env:
          KS_PASSWORD: xrj45yWGLbsO7W0v
        run: |
          set -eu
          java -jar bundletool.jar build-apks \
            --bundle=input/app-release.aab \
            --output=termux-app-release-universal.apks \
            --mode=universal \
            --ks=app/testkey_untrusted.jks \
            --ks-key-alias=alias \
            --ks-pass=pass:${KS_PASSWORD} \
            --key-pass=pass:${KS_PASSWORD}
          unzip -t termux-app-release-universal.apks
          unzip -l termux-app-release-universal.apks | tee termux-app-release-universal.apks.listing
          unzip -p termux-app-release-universal.apks toc.pb > termux-app-release-universal.apks.toc.pb
          test -s termux-app-release-universal.apks.toc.pb
          grep -q 'universal.apk' termux-app-release-universal.apks.listing
          {
            echo '## Release universal APKS'
            echo
            sha256sum input/app-release.aab termux-app-release-universal.apks
            echo
            java -jar bundletool.jar version
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload universal APKS only
        uses: actions/upload-artifact@v6
        with:
          name: termux-app-release-universal-apks
          if-no-files-found: error
          path: |
            termux-app-release-universal.apks
            termux-app-release-universal.apks.listing
            termux-app-release-universal.apks.toc.pb
            bundletool.sha256
