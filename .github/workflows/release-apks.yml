# Build a release Android App Bundle and materialize a signed universal APK.
name: Release APKS

on:
  workflow_dispatch:
  push:
    branches: [ build/release-apks ]

permissions:
  contents: read

env:
  JAVA_VERSION: 21
  BUNDLETOOL_VERSION: 1.18.2

jobs:
  build-release-apks:
    name: bundleRelease -> signed universal .apks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Build release Android App Bundle
        run: |
          ./gradlew bundleRelease --no-daemon
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Download bundletool
        run: |
          curl --fail --location --retry 3 \
            -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          test -s bundletool.jar
          sha256sum bundletool.jar | tee bundletool.sha256

      - name: Build signed universal release APK set
        env:
          KS_PASSWORD: xrj45yWGLbsO7W0v
        run: |
          java -jar bundletool.jar build-apks \
            --bundle=app/build/outputs/bundle/release/app-release.aab \
            --output=termux-app-release-universal.apks \
            --mode=universal \
            --ks=app/testkey_untrusted.jks \
            --ks-key-alias=alias \
            --ks-pass=pass:${KS_PASSWORD} \
            --key-pass=pass:${KS_PASSWORD}

      - name: Verify signed release APKS contents
        run: |
          set -eu
          unzip -t termux-app-release-universal.apks
          unzip -l termux-app-release-universal.apks | tee termux-app-release-universal.apks.listing
          unzip -p termux-app-release-universal.apks toc.pb > termux-app-release-universal.apks.toc.pb
          test -s termux-app-release-universal.apks.toc.pb
          unzip -l termux-app-release-universal.apks | grep 'universal.apk'
          {
            echo '## Release APKS'
            echo
            echo '### Artifacts'
            sha256sum app/build/outputs/bundle/release/app-release.aab \
              termux-app-release-universal.apks
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release AAB and signed APKS
        uses: actions/upload-artifact@v6
        with:
          name: termux-app-release-apks
          if-no-files-found: error
          path: |
            app/build/outputs/bundle/release/app-release.aab
            termux-app-release-universal.apks
            *.listing
            *.sha256
