# Render smoke test on GitHub-hosted CI with a software GPU (SwiftShader).
# Graduated from spike/gpu-emulation-probe (docs/SPIKE-gpu-ci-emulation.md):
# validated costs - SDK install 63s, emulator boot 60s (KVM + SwiftShader),
# APK install 14s, end-to-end ~5 min.
#
# Validates (per spike verdict): render regressions - crash-free cold start,
# real text rasterization, pixel assertions. Does NOT validate Mali/Adreno
# driver quirks or on-device performance.
name: Render smoke (SwiftShader)

on:
  push:
    branches: [ master ]
    paths:
      - 'app/**'
      - 'support_ui/**'
      - 'terminal-emulator/**'
      - 'terminal-view/**'
      - 'termux-shared/**'
      - 'buildSrc/**'
      - 'scripts/**'
      - '*.gradle'
      - '*.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/render-smoke.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'app/**'
      - 'support_ui/**'
      - 'terminal-emulator/**'
      - 'terminal-view/**'
      - 'termux-shared/**'
      - 'buildSrc/**'
      - 'scripts/**'
      - '*.gradle'
      - '*.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/render-smoke.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: 21
  BUNDLETOOL_VERSION: 1.18.2

jobs:
  render-smoke:
    name: Emulator render smoke (x86_64 + ${{ matrix.gpu }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gpu: [swiftshader_indirect, "off"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Record runner spec
        run: |
          nproc
          free -h | head -2
          ls -la /dev/kvm && echo KVM_PRESENT

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Verify restored Gradle cache files
        if: always()
        run: |
          set -uo pipefail
          modules="$HOME/.gradle/caches/modules-2/files-2.1"
          wrapper="$HOME/.gradle/wrapper/dists"
          module_files=0
          wrapper_files=0
          module_size="0B"
          wrapper_size="0B"
          if [ -d "$modules" ]; then
            module_files=$(find "$modules" -type f | wc -l)
            module_size=$(du -sh "$modules" | cut -f1)
          fi
          if [ -d "$wrapper" ]; then
            wrapper_files=$(find "$wrapper" -type f | wc -l)
            wrapper_size=$(du -sh "$wrapper" | cut -f1)
          fi
          {
            echo "GRADLE_MODULE_CACHE_FILES=$module_files"
            echo "GRADLE_MODULE_CACHE_SIZE=$module_size"
            echo "GRADLE_WRAPPER_CACHE_FILES=$wrapper_files"
            echo "GRADLE_WRAPPER_CACHE_SIZE=$wrapper_size"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # This step intentionally does not fail: actions/setup-java cache restore
          # can be a cold miss. The build step will populate the cache if needed.

      - name: Install SDK pieces (timed)
        run: |
          set -x
          SDK="$ANDROID_HOME"
          t0=$(date +%s)
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;34.0.0" \
            "platform-tools" "emulator" \
            "system-images;android-36;google_apis;x86_64" >/dev/null
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"
          t1=$(date +%s)
          echo "SDK_INSTALL_SECONDS=$((t1-t0))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build fused debug APK from AAB
        env:
          KS_PASSWORD: xrj45yWGLbsO7W0v
        run: |
          ./gradlew bundleDebug --no-daemon
          curl --fail --location --retry 3 \
            -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          java -jar bundletool.jar build-apks \
            --bundle=app/build/outputs/bundle/debug/app-debug.aab \
            --output=termux-app-debug-universal.apks \
            --mode=universal \
            --ks=app/testkey_untrusted.jks \
            --ks-key-alias=alias \
            --ks-pass=pass:${KS_PASSWORD} \
            --key-pass=pass:${KS_PASSWORD}
          mkdir -p render-apk
          unzip -o termux-app-debug-universal.apks universal.apk -d render-apk

      - name: Boot emulator with SwiftShader (timed)
        env:
          ANDROID_AVD_HOME: /home/runner/.android/avd
        run: |
          set -x
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n smoke --package "system-images;android-36;google_apis;x86_64" --device pixel_5
          if [ ! -f "$ANDROID_AVD_HOME/smoke.ini" ]; then
            echo "SMOKE_AVD_MISSING: avdmanager returned 0 but smoke.ini absent - failing fast"
            exit 42
          fi
          t0=$(date +%s)
          nohup "$ANDROID_HOME/emulator/emulator" -avd smoke \
            -gpu "${{ matrix.gpu }}" -no-window -no-audio -no-boot-anim \
            -no-snapshot -wipe-data -memory 3072 -cores 3 \
            > /tmp/emu.log 2>&1 &
          # Boot wait with hard cap and per-minute progress evidence
          # (never adb wait-for-device bare: a dead emulator hangs it until
          #  the job timeout - burned 27min in the spike before this fix)
          for i in $(seq 1 15); do
            sleep 60
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "[boot-wait minute $i] sys.boot_completed='$BOOT'"
            if [ "$BOOT" = "1" ]; then break; fi
            if ! pgrep -f "emulator.*-avd smoke" >/dev/null; then
              echo "EMULATOR_PROCESS_DIED"; tail -30 /tmp/emu.log; exit 43
            fi
          done
          BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
          if [ "$BOOT" != "1" ]; then
            echo "BOOT_TIMEOUT_15MIN"; tail -40 /tmp/emu.log; adb devices; exit 44
          fi
          t1=$(date +%s)
          echo "EMU_BOOT_SECONDS=$((t1-t0))" | tee -a "$GITHUB_STEP_SUMMARY"
          adb devices

      - name: GPU identity evidence
        run: |
          echo "== ro.hardware.egl =="
          adb shell getprop ro.hardware.egl
          echo "== SurfaceFlinger GLES =="
          adb shell dumpsys SurfaceFlinger | grep -iE '^GLES|GLES:' | head -5 || true

      - name: Cold start + capture screenshots
        run: |
          set -x
          adb install -r render-apk/universal.apk
          # Grant storage permission so the bootstrap can write, then cold start
          adb shell pm grant com.termux android.permission.WRITE_EXTERNAL_STORAGE || true
          # Debug builds include the compile-time frame diagnostic implementation.
          # Release builds use the empty source-set implementation and cannot enable it via Intent.
          adb logcat -c
          adb shell am force-stop com.termux
          adb shell am start -W -S -n com.termux/.app.TermuxActivity
          # Boot and bootstrap time varies on GitHub-hosted emulator instances. Wait
          # for the first real frame instead of turning that scheduling variance into
          # a false render failure; the later step still requires three valid lines.
          frame_seen=0
          for _ in $(seq 1 40); do
            if adb logcat -d | grep -q 'Termux:TerminalView.*frame rev='; then
              frame_seen=1
              break
            fi
            sleep 1
          done
          if [ "$frame_seen" -ne 1 ]; then
            echo 'Timed out waiting for first frame diagnostic'
            adb logcat -d | tail -100
            exit 1
          fi
          adb shell ps -A | grep com.termux
          # First screenshot right after boot-to-idle
          adb exec-out screencap -p > render_initial.png
          # Inject a keyboard glyph to prove live input -> render pipeline
          adb shell input keyevent KEYCODE_MOVE_END
          adb shell input text "smoke"
          sleep 3
          adb exec-out screencap -p > render_after_input.png
          adb logcat -d | grep -iE 'FATAL|AndroidRuntime.*com.termux' | tail -20 || true

      - name: Frame pipeline smoke assertion
        run: |
          set -euo pipefail
          adb logcat -d > logcat-smoke.txt
          grep -E 'Termux:TerminalView.*frame rev=' logcat-smoke.txt > frame-info-lines.txt \
            || { echo 'NO_FRAME_INFO_LINES'; tail -50 logcat-smoke.txt; exit 1; }
          wc -l frame-info-lines.txt
          python3 .github/workflows/verify_frame_metrics.py frame-info-lines.txt --min-lines 3 --min-drawn-ratio 0.3

      - name: Pixel assertions
        if: matrix.gpu == 'swiftshader_indirect'
        run: |
          python3 -m pip install --quiet Pillow
          python3 .github/workflows/assert_render.py render_initial.png
          python3 .github/workflows/assert_render.py render_after_input.png

      # The default rendering mode is 'system' -> LAYER_TYPE_NONE, which never
      # enables the clean-row redraw skip (canvas contents are not preserved).
      # To prove the skip path itself, switch to the hwui_gpu mode (-> LAYER_TYPE_HARDWARE),
      # restart the activity, and demand at least one frame that actually skipped rows.
      - name: Hwui GPU clean-row skip path (implies renderer row culling)
        if: matrix.gpu == 'swiftshader_indirect'
        run: |
          set -euo pipefail
          # Write the rendering mode preference through run-as (debug build is debuggable).
          # Avoid heredoc inside run-as quoting; generate the file on the runner and copy it in.
          cat > /tmp/termux_prefs.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8" standalone="yes" ?>
          <map>
              <string name="terminal_rendering_mode">hwui_gpu</string>
          </map>
          EOF
          adb push /tmp/termux_prefs.xml /data/local/tmp/termux_prefs.xml
          adb shell run-as com.termux mkdir -p shared_prefs
          adb shell run-as com.termux cp /data/local/tmp/termux_prefs.xml shared_prefs/com.termux_preferences.xml
          adb shell am force-stop com.termux
          adb logcat -c
          adb shell am start -W -S -n com.termux/.app.TermuxActivity | tee /tmp/hwui-start.txt
          # Wait for the first frame under the new mode.
          frame_seen=0
          for _ in $(seq 1 40); do
            if adb logcat -d | grep -q 'Termux:TerminalView.*frame rev='; then
              frame_seen=1
              break
            fi
            sleep 1
          done
          if [ "$frame_seen" -ne 1 ]; then
            echo 'Timed out waiting for frame diagnostics under hwui_gpu'
            adb logcat -d | tail -100
            exit 1
          fi
          # Give the idle app a few frames so unchanged rows are actually skipped,
          # then capture and assert both the frame metrics (skipped>0 required) and
          # that pixels still render correctly through the layered path.
          sleep 3
          adb shell input keyevent KEYCODE_MOVE_END
          adb shell input text "hwui"
          sleep 3
          adb exec-out screencap -p > render_hwui.png
          adb logcat -d > logcat-hwui.txt
          grep -E 'Termux:TerminalView.*frame rev=' logcat-hwui.txt > frame-info-hwui.txt \
            || { echo 'NO_FRAME_INFO_LINES under hwui_gpu'; tail -50 logcat-hwui.txt; exit 1; }
          python3 .github/workflows/verify_frame_metrics.py frame-info-hwui.txt --min-lines 3 --require-skipped --min-drawn-ratio 0.3
          python3 .github/workflows/assert_render.py render_hwui.png
          # gfxinfo percentiles over a deterministic burst (hardware-layer path):
          # TotalTime/WaitTime come from the -W cold start just performed above.
          adb shell dumpsys gfxinfo com.termux reset >/dev/null
          for i in $(seq 1 40); do
            adb shell input text "b$i"
          done
          sleep 3
          GFX=$(adb shell dumpsys gfxinfo com.termux)
          TOTAL_FRAMES=$(echo "$GFX" | grep -oE 'Total frames rendered: [0-9]+' | grep -oE '[0-9]+' | head -1 || echo 0)
          JANKY=$(echo "$GFX" | grep -oE 'Janky frames: [0-9]+ \(' | grep -oE '[0-9]+' | head -1 || echo 0)
          # Take the VALUE after "percentile:", not the percentile label itself.
          P50=$(echo "$GFX" | grep -oE '50th percentile: [0-9]+ms' | awk '{print $3}' | tr -d 'ms' | head -1 || echo -1)
          P90=$(echo "$GFX" | grep -oE '90th percentile: [0-9]+ms' | awk '{print $3}' | tr -d 'ms' | head -1 || echo -1)
          P95=$(echo "$GFX" | grep -oE '95th percentile: [0-9]+ms' | awk '{print $3}' | tr -d 'ms' | head -1 || echo -1)
          P99=$(echo "$GFX" | grep -oE '99th percentile: [0-9]+ms' | awk '{print $3}' | tr -d 'ms' | head -1 || echo -1)
          echo "$GFX" > perf-emulator-gfx.txt
          {
            echo "## HWUI gfxinfo probe (hardware layer, SwiftShader software stack)"
            grep -E 'TotalTime|WaitTime' /tmp/hwui-start.txt | tr -d '\r' | sed 's/^/COLD_START_/'
            echo "GFX_TOTAL_FRAMES=${TOTAL_FRAMES:-0}"
            echo "GFX_JANKY_FRAMES=${JANKY:-0}"
            echo "GFX_P50_MS=${P50:--1}"
            echo "GFX_P90_MS=${P90:--1}"
            echo "GFX_P95_MS=${P95:--1}"
            echo "GFX_P99_MS=${P99:--1}"
            echo "NOTE=software/emulator evidence; not physical-GPU acceptance"
          } | tee -a perf-emulator-gfx.txt "$GITHUB_STEP_SUMMARY"
          adb logcat -d | grep -iE 'FATAL|AndroidRuntime.*com.termux' | tail -20 || true

      # #52 spike 3b: the surface route moves pixels to a dedicated render thread +
      # persistent backbuffer presented through a SurfaceView. Prove the route
      # actually executes: frame diagnostics must come from the backbuffer path
      # (published keeps advancing while drawn stays pinned at the view's last
      # reference-path frame), pixels must still assert, and the SurfaceView must
      # own a live surface.
      - name: Surface backbuffer route (#52 spike 3b)
        if: matrix.gpu == 'swiftshader_indirect'
        run: |
          set -euo pipefail
          # Write the rendering mode preference through run-as (debug build is debuggable).
          cat > /tmp/termux_prefs_surface.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8" standalone="yes" ?>
          <map>
              <string name="terminal_rendering_mode">surface</string>
          </map>
          EOF
          adb push /tmp/termux_prefs_surface.xml /data/local/tmp/termux_prefs_surface.xml
          adb shell run-as com.termux mkdir -p shared_prefs
          adb shell run-as com.termux cp /data/local/tmp/termux_prefs_surface.xml shared_prefs/com.termux_preferences.xml
          adb shell am force-stop com.termux
          adb logcat -c
          adb shell am start -W -S -n com.termux/.app.TermuxActivity
          frame_seen=0
          for _ in $(seq 1 40); do
            if adb logcat -d | grep -q 'Termux:SurfaceBackbuffer.*frame rev='; then
              frame_seen=1
              break
            fi
            sleep 1
          done
          if [ "$frame_seen" -ne 1 ]; then
            echo 'Timed out waiting for surface backbuffer frame diagnostics'
            adb logcat -d | tail -100
            exit 1
          fi
          # Live input must flow producer -> surface mailbox -> backbuffer present.
          # 20 injections give the raster aggregates a usable sample size.
          adb shell input keyevent KEYCODE_MOVE_END
          for i in $(seq 1 20); do
            adb shell input text "s$i"
          done
          sleep 3
          adb exec-out screencap -p > render_surface.png
          adb logcat -d > logcat-surface.txt
          grep -E 'Termux:SurfaceBackbuffer.*frame rev=' logcat-surface.txt > frame-info-surface.txt \
            || { echo 'NO_SURFACE_FRAME_LINES'; tail -50 logcat-surface.txt; exit 1; }
          wc -l frame-info-surface.txt
          # Surface currently uses correctness-first full redraws. The required
          # assertion is complete-frame output, not clean-row reuse.
          python3 .github/workflows/verify_frame_metrics.py frame-info-surface.txt --min-lines 3 --min-drawn-ratio 0.3
          python3 .github/workflows/assert_render.py render_surface.png
          # Route evidence: the surface mode must have been applied at activity
          # startup (logged via Logger.logInfo into logcat).
          grep -m1 'Terminal rendering mode=surface' logcat-surface.txt \
            || { echo 'SURFACE_MODE_NOT_APPLIED'; exit 1; }
          adb logcat -d | grep -iE 'FATAL|AndroidRuntime.*com.termux' | tail -20 || true

      # Surface-route raster cost lives on the render thread, invisible to gfxinfo
      # (which only counts HWUI frames). Aggregate the backbuffer diagnostics
      # instead: per-present CPU raster cost from the tagged Termux:SurfaceBackbuffer
      # lines. Software/emulator evidence only — never physical-GPU acceptance.
      - name: Surface route raster aggregates (render thread)
        if: matrix.gpu == 'swiftshader_indirect'
        run: |
          set -euo pipefail
          DRAW_AVG=$(grep -oE 'drawTextNs=[0-9]+' frame-info-surface.txt | grep -oE '[0-9]+' | awk '{s+=$1;n++} END{if(n>0) printf "%.0f", s/n; else print "-1"}')
          PAINT_AVG=$(grep -oE 'paintSetupNs=[0-9]+' frame-info-surface.txt | grep -oE '[0-9]+' | awk '{s+=$1;n++} END{if(n>0) printf "%.0f", s/n; else print "-1"}')
          ROWS_AVG=$(grep -oE 'renderRows=[0-9]+' frame-info-surface.txt | grep -oE '[0-9]+' | awk '{s+=$1;n++} END{if(n>0) printf "%.0f", s/n; else print "-1"}')
          CELLS_AVG=$(grep -oE 'renderCells=[0-9]+' frame-info-surface.txt | grep -oE '[0-9]+' | awk '{s+=$1;n++} END{if(n>0) printf "%.0f", s/n; else print "-1"}')
          PRESENTS=$(wc -l < frame-info-surface.txt | tr -d ' ')
          # Present (lockCanvas..post) cost: the blit segment invisible to other
          # counters. Percentiles over nanosecond values.
          PRESENT_STATS=$(grep -oE 'presentNs=[0-9]+' frame-info-surface.txt | grep -oE '[0-9]+' | sort -n | awk '{a[NR]=$1; s+=$1} END {if(n>0) printf "min=%.2f p50=%.2f max=%.2f avg=%.2f n=%d", a[1]/1e6, a[int(NR*0.5)]/1e6, a[NR]/1e6, s/NR/1e6, NR; else print "none"}')
          {
            echo "## Surface route raster aggregates (render thread, backbuffer presents)"
            echo "SURFACE_PRESENTS=$PRESENTS"
            echo "SURFACE_DRAW_TEXT_NS_AVG=$DRAW_AVG"
            echo "SURFACE_PAINT_SETUP_NS_AVG=$PAINT_AVG"
            echo "SURFACE_RENDER_ROWS_AVG=$ROWS_AVG"
            echo "SURFACE_RENDER_CELLS_AVG=$CELLS_AVG"
            echo "SURFACE_PRESENT_MS(min/p50/max/avg)=$PRESENT_STATS"
            echo "NOTE=software/emulator evidence; not physical-GPU acceptance"
          } | tee -a perf-emulator.txt "$GITHUB_STEP_SUMMARY"

      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: render-smoke-evidence-${{ matrix.gpu }}
          path: |
            render_initial.png
            render_after_input.png
            render_hwui.png
            render_surface.png
            perf-emulator-gfx.txt
            perf-emulator.txt
            logcat-smoke.txt
            logcat-hwui.txt
            logcat-surface.txt
            frame-info-lines.txt
            frame-info-hwui.txt
            frame-info-surface.txt
            /tmp/emu.log
          if-no-files-found: warn

      - name: Kill emulator
        if: always()
        run: adb emu kill || pkill -f qemu-system || true
