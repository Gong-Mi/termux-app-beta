name: CI (x86 + ARM Linux)

on:
  push:
    branches: [ master ]
    paths:
      - 'app/**'
      - 'support_ui/**'
      - 'terminal-emulator/**'
      - 'terminal-view/**'
      - 'termux-shared/**'
      - 'buildSrc/**'
      - 'scripts/**'
      - '*.gradle'
      - '*.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'app/**'
      - 'support_ui/**'
      - 'terminal-emulator/**'
      - 'terminal-view/**'
      - 'termux-shared/**'
      - 'buildSrc/**'
      - 'scripts/**'
      - '*.gradle'
      - '*.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: 21

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate device smoke scripts
        run: bash -n scripts/android_compat_log_smoke.sh

      - name: Validate Android version-sensitive manifest permissions
        run: python3 scripts/verify_manifest_compat.py

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      # ubuntu-24.04-arm images do not ship a preinstalled Android SDK
      # (x86 images do). cmdline-tools are JVM jars and run fine on aarch64.
      - name: Set up Android SDK (ARM64 runner)
        if: runner.arch == 'ARM64'
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          if [ "$RUNNER_ARCH" = "ARM64" ]; then
            # ARM64 leg: AGP 8.4.2's aapt2 has no linux-aarch64 binary (the
            # maven -linux.jar is x86-64 only, no -linux-aarch64 artifact,
            # and no build-tools aarch64 package exists), so resource
            # processing cannot run on aarch64. terminal-emulator is a pure
            # Java module (no res/) -- its unit tests run aapt2-free.
            ./gradlew :terminal-emulator:testDebugUnitTest
          else
            ./gradlew test
          fi

      - name: Verify tests actually ran (no vacuous green)
        run: |
          if [ "$RUNNER_ARCH" = "ARM64" ]; then
            python3 .github/workflows/verify_tests.py --require-module=terminal-emulator
          else
            python3 .github/workflows/verify_tests.py --require-module=app --require-module=terminal-emulator
          fi

  build-apk:
    # Full APK build. x86 only: Google ships no linux-aarch64 NDK host
    # package (verified in repository2-3.xml), so the ndkBuild step cannot
    # run on ARM64 Linux runners.
    name: Build APK (x86)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: termux-app-debug
          path: app/build/outputs/apk/debug/*.apk
