# Build a signed Android App Bundle and materialize its split APK set.
# This is an experiment for measuring whether packaging modularity changes
# runtime behavior/performance; it is not a release workflow.
name: Signed APKS experiment

on:
  workflow_dispatch:
  push:
    branches: [ build/signed-apks ]

permissions:
  contents: read

env:
  JAVA_VERSION: 21
  BUNDLETOOL_VERSION: 1.18.2

jobs:
  build-signed-apks:
    name: bundleDebug -> signed .apks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Build Android App Bundle
        run: |
          ./gradlew bundleDebug --no-daemon
          test -s app/build/outputs/bundle/debug/app-debug.aab

      - name: Download bundletool
        run: |
          curl --fail --location --retry 3 \
            -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          test -s bundletool.jar
          sha256sum bundletool.jar | tee bundletool.sha256

      - name: Build signed split APK set
        env:
          KS_PASSWORD: xrj45yWGLbsO7W0v
        run: |
          java -jar bundletool.jar build-apks \
            --bundle=app/build/outputs/bundle/debug/app-debug.aab \
            --output=termux-app-debug-default.apks \
            --mode=default \
            --ks=app/testkey_untrusted.jks \
            --ks-key-alias=alias \
            --ks-pass=pass:${KS_PASSWORD} \
            --key-pass=pass:${KS_PASSWORD}

          java -jar bundletool.jar build-apks \
            --bundle=app/build/outputs/bundle/debug/app-debug.aab \
            --output=termux-app-debug-universal.apks \
            --mode=universal \
            --ks=app/testkey_untrusted.jks \
            --ks-key-alias=alias \
            --ks-pass=pass:${KS_PASSWORD} \
            --key-pass=pass:${KS_PASSWORD}

      - name: Verify signed APKS contents
        run: |
          set -eu
          for file in termux-app-debug-default.apks termux-app-debug-universal.apks; do
            unzip -t "$file"
            unzip -l "$file" | tee "${file}.listing"
            unzip -p "$file" toc.pb > "${file}.toc.pb"
            test -s "${file}.toc.pb"
          done
          unzip -l termux-app-debug-default.apks | grep -E 'base-master.apk|base-arm64_v8a.apk|base-x86_64.apk'
          unzip -l termux-app-debug-universal.apks | grep 'universal.apk'
          {
            echo '## Signed APKS experiment'
            echo
            echo '### Artifacts'
            sha256sum app/build/outputs/bundle/debug/app-debug.aab \
              termux-app-debug-default.apks termux-app-debug-universal.apks
            echo
            echo '### Split APK entries'
            unzip -l termux-app-debug-default.apks
            echo
            echo '### Bundletool'
            java -jar bundletool.jar version
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AAB and signed APKS
        uses: actions/upload-artifact@v6
        with:
          name: termux-app-signed-apks
          if-no-files-found: error
          path: |
            app/build/outputs/bundle/debug/app-debug.aab
            termux-app-debug-default.apks
            termux-app-debug-universal.apks
            *.listing
            *.sha256

  emulator-split-smoke:
    name: Install split APKS on SwiftShader emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Record runner spec
        run: |
          nproc
          free -h | head -2
          test -e /dev/kvm

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Install Android emulator and x86_64 system image
        run: |
          SDK="$ANDROID_HOME"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;34.0.0" "platform-tools" \
            "emulator" "system-images;android-36;google_apis;x86_64" >/dev/null
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build AAB and signed default APKS
        env:
          KS_PASSWORD: xrj45yWGLbsO7W0v
        run: |
          ./gradlew bundleDebug --no-daemon
          curl --fail --location --retry 3 \
            -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          java -jar bundletool.jar build-apks \
            --bundle=app/build/outputs/bundle/debug/app-debug.aab \
            --output=termux-app-debug-emulator.apks \
            --mode=default \
            --ks=app/testkey_untrusted.jks \
            --ks-key-alias=alias \
            --ks-pass=pass:${KS_PASSWORD} \
            --key-pass=pass:${KS_PASSWORD}

      - name: Boot x86_64 emulator with SwiftShader
        env:
          ANDROID_AVD_HOME: /home/runner/.android/avd
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n split-smoke --package "system-images;android-36;google_apis;x86_64" --device pixel_5
          test -f "$ANDROID_AVD_HOME/split-smoke.ini"
          nohup "$ANDROID_HOME/emulator/emulator" -avd split-smoke \
            -gpu swiftshader_indirect -no-window -no-audio -no-boot-anim \
            -no-snapshot -wipe-data -memory 3072 -cores 3 \
            > /tmp/split-emu.log 2>&1 &
          for i in $(seq 1 15); do
            sleep 60
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "[boot-wait minute $i] sys.boot_completed='$BOOT'"
            if [ "$BOOT" = "1" ]; then break; fi
            pgrep -f "emulator.*-avd split-smoke" >/dev/null || { tail -50 /tmp/split-emu.log; exit 43; }
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"

      - name: Install split APKS and launch
        run: |
          java -jar bundletool.jar install-apks \
            --apks=termux-app-debug-emulator.apks \
            --adb="$ANDROID_HOME/platform-tools/adb"
          adb shell pm path com.termux | tee installed-splits.txt
          test "$(grep -c '^package:' installed-splits.txt)" -gt 1
          adb shell am start -W -n com.termux/.app.TermuxActivity
          sleep 20
          adb shell dumpsys activity activities | grep -E 'topResumedActivity|com.termux'
          adb exec-out screencap -p > split-render.png
          adb logcat -d | grep -iE 'FATAL|AndroidRuntime.*com.termux' | tail -20 || true

      - name: Assert split render and upload evidence
        run: |
          python3 -m pip install --quiet Pillow
          python3 .github/workflows/assert_render.py split-render.png

      - name: Build fused universal APKS
        env:
          KS_PASSWORD: xrj45yWGLbsO7W0v
        run: |
          java -jar bundletool.jar build-apks \
            --bundle=app/build/outputs/bundle/debug/app-debug.aab \
            --output=termux-app-debug-universal.apks \
            --mode=universal \
            --ks=app/testkey_untrusted.jks \
            --ks-key-alias=alias \
            --ks-pass=pass:${KS_PASSWORD} \
            --key-pass=pass:${KS_PASSWORD}
          unzip -l termux-app-debug-universal.apks | tee fused-apks-listing.txt
          # fused form must be exactly one universal.apk (base + install-time feature fused)
          test "$(grep -c 'universal.apk' fused-apks-listing.txt)" -ge 1

      - name: Install fused APK and verify feature routing
        run: |
          mkdir -p fused
          unzip -o termux-app-debug-universal.apks universal.apk -d fused
          adb uninstall com.termux >/dev/null 2>&1 || true
          adb install -r fused/universal.apk
          # single-APK form: package resolves to exactly one apk path
          adb shell pm path com.termux | tee fused-pm-path.txt
          test "$(grep -c '^package:' fused-pm-path.txt)" -eq 1
          # external routing to SettingsActivity (feature component, exported=true)
          adb shell am start -W -n com.termux/.app.TermuxActivity
          sleep 15
          adb shell am start -W -a com.termux.action.OPEN_SETTINGS
          sleep 5
          adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' | tee fused-focus.txt
          grep -q SettingsActivity fused-focus.txt
          adb exec-out screencap -p > fused-settings.png
          # HelpActivity is exported=false: resolve proves the feature manifest
          # survived the fuse, and an external start must be DENIED (the fuse must
          # not have widened the activity to exported). In-app launch is exercised
          # by SettingsActivity above; am-as-app (run-as) is blocked by ATMS
          # package/uid matching on modern Android.
          adb shell cmd package resolve-activity -a com.termux.action.OPEN_HELP | tee fused-resolve.txt
          grep -q 'HelpActivity' fused-resolve.txt
          if adb shell am start -W -a com.termux.action.OPEN_HELP 2>&1 | tee fused-help-denied.txt | grep -q 'SecurityException'; then
            echo "HELP_EXPORTED_FALSE_ENFORCED_POST_FUSE"
          else
            echo "FAIL: HelpActivity was externally startable (exported flag lost during fuse)"
            cat fused-help-denied.txt
            exit 1
          fi
          adb logcat -d | grep -iE 'FATAL|AndroidRuntime.*com.termux' | tail -20 || true

      - name: Upload fused APK evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fused-apk-evidence
          path: |
            fused-apks-listing.txt
            fused-pm-path.txt
            fused-focus.txt
            fused-resolve.txt
            fused-help-denied.txt
            fused-settings.png
          if-no-files-found: warn

      - name: Upload split emulator evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: signed-apks-emulator-evidence
          path: |
            split-render.png
            installed-splits.txt
            /tmp/split-emu.log

      - name: Kill emulator
        if: always()
        run: adb emu kill || pkill -f qemu-system || true
