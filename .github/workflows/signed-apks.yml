# Build one debug AAB, then materialize each delivery target independently.
# The default split set and fused universal set are deliberately separate jobs
# and separate Actions artifacts so a download never mixes install targets.
name: Signed APKS experiment

on:
  workflow_dispatch:
  push:
    branches: [ build/signed-apks ]

permissions:
  contents: read

env:
  JAVA_VERSION: 21
  BUNDLETOOL_VERSION: 1.18.2

jobs:
  build-debug-aab:
    name: bundleDebug -> AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Build Android App Bundle
        run: |
          ./gradlew bundleDebug --no-daemon
          test -s app/build/outputs/bundle/debug/app-debug.aab

      - name: Upload debug AAB
        uses: actions/upload-artifact@v6
        with:
          name: termux-app-debug-aab
          if-no-files-found: error
          path: app/build/outputs/bundle/debug/app-debug.aab

  package-debug-default:
    name: AAB -> signed default split .apks
    needs: build-debug-aab
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout signing fixture
        uses: actions/checkout@v6

      - name: Download debug AAB
        uses: actions/download-artifact@v6
        with:
          name: termux-app-debug-aab
          path: input

      - name: Download bundletool
        run: |
          curl --fail --location --retry 3 \
            -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          test -s bundletool.jar
          sha256sum bundletool.jar | tee bundletool.sha256

      - name: Build and verify default split APKS
        env:
          KS_PASSWORD: xrj45yWGLbsO7W0v
        run: |
          set -eu
          java -jar bundletool.jar build-apks \
            --bundle=input/app-debug.aab \
            --output=termux-app-debug-default.apks \
            --mode=default \
            --ks=app/testkey_untrusted.jks \
            --ks-key-alias=alias \
            --ks-pass=pass:${KS_PASSWORD} \
            --key-pass=pass:${KS_PASSWORD}
          unzip -t termux-app-debug-default.apks
          unzip -l termux-app-debug-default.apks | tee termux-app-debug-default.apks.listing
          unzip -p termux-app-debug-default.apks toc.pb > termux-app-debug-default.apks.toc.pb
          test -s termux-app-debug-default.apks.toc.pb
          split_count=$(grep -cE 'splits/[^ ]+\.apk' termux-app-debug-default.apks.listing)
          test "$split_count" -gt 1
          grep -Eq 'splits/base-master\.apk|splits/base-arm64_v8a\.apk|splits/base-x86_64\.apk' termux-app-debug-default.apks.listing
          ! grep -qE 'universal\.apk' termux-app-debug-default.apks.listing
          {
            echo '## Debug default split APKS'
            echo
            echo "SPLIT_APK_COUNT=$split_count"
            sha256sum input/app-debug.aab termux-app-debug-default.apks
            echo
            java -jar bundletool.jar version
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload default split APKS only
        uses: actions/upload-artifact@v6
        with:
          name: termux-app-debug-default-apks
          if-no-files-found: error
          path: |
            termux-app-debug-default.apks
            termux-app-debug-default.apks.listing
            termux-app-debug-default.apks.toc.pb
            bundletool.sha256

  package-debug-universal:
    name: AAB -> signed fused universal .apks
    needs: build-debug-aab
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout signing fixture
        uses: actions/checkout@v6

      - name: Download debug AAB
        uses: actions/download-artifact@v6
        with:
          name: termux-app-debug-aab
          path: input

      - name: Download bundletool
        run: |
          curl --fail --location --retry 3 \
            -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          test -s bundletool.jar
          sha256sum bundletool.jar | tee bundletool.sha256

      - name: Build and verify fused universal APKS
        env:
          KS_PASSWORD: xrj45yWGLbsO7W0v
        run: |
          set -eu
          java -jar bundletool.jar build-apks \
            --bundle=input/app-debug.aab \
            --output=termux-app-debug-universal.apks \
            --mode=universal \
            --ks=app/testkey_untrusted.jks \
            --ks-key-alias=alias \
            --ks-pass=pass:${KS_PASSWORD} \
            --key-pass=pass:${KS_PASSWORD}
          unzip -t termux-app-debug-universal.apks
          unzip -l termux-app-debug-universal.apks | tee termux-app-debug-universal.apks.listing
          unzip -p termux-app-debug-universal.apks toc.pb > termux-app-debug-universal.apks.toc.pb
          test -s termux-app-debug-universal.apks.toc.pb
          grep -q 'universal.apk' termux-app-debug-universal.apks.listing
          mkdir -p universal-apk
          unzip -o termux-app-debug-universal.apks universal.apk -d universal-apk
          mv universal-apk/universal.apk termux-app-debug-universal.apk
          sha256sum termux-app-debug-universal.apk | tee termux-app-debug-universal.apk.sha256
          {
            echo '## Debug fused universal APKS'
            echo
            sha256sum input/app-debug.aab termux-app-debug-universal.apks
            echo
            java -jar bundletool.jar version
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload universal APKS only
        uses: actions/upload-artifact@v6
        with:
          name: termux-app-debug-universal-apks
          if-no-files-found: error
          path: |
            termux-app-debug-universal.apks
            termux-app-debug-universal.apks.listing
            termux-app-debug-universal.apks.toc.pb
            bundletool.sha256

      - name: Upload universal APK only
        uses: actions/upload-artifact@v6
        with:
          name: termux-app-debug-universal-apk
          if-no-files-found: error
          path: |
            termux-app-debug-universal.apk
            termux-app-debug-universal.apk.sha256

  emulator-split-smoke:
    name: Install exact default and universal targets on SwiftShader emulator
    needs: [package-debug-default, package-debug-universal]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Record runner spec
        run: |
          nproc
          free -h | head -2
          test -e /dev/kvm

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Install Android emulator and x86_64 system image
        run: |
          SDK="$ANDROID_HOME"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;34.0.0" "platform-tools" \
            "emulator" "system-images;android-36;google_apis;x86_64" >/dev/null
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"

      - name: Checkout render verifier
        uses: actions/checkout@v6

      - name: Download exact default target
        uses: actions/download-artifact@v6
        with:
          name: termux-app-debug-default-apks
          path: default-target

      - name: Download exact universal target
        uses: actions/download-artifact@v6
        with:
          name: termux-app-debug-universal-apks
          path: universal-target

      - name: Download bundletool
        run: |
          curl --fail --location --retry 3 \
            -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          test -s bundletool.jar

      - name: Boot x86_64 emulator with SwiftShader
        env:
          ANDROID_AVD_HOME: /home/runner/.android/avd
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n split-smoke --package "system-images;android-36;google_apis;x86_64" --device pixel_5
          test -f "$ANDROID_AVD_HOME/split-smoke.ini"
          nohup "$ANDROID_HOME/emulator/emulator" -avd split-smoke \
            -gpu swiftshader_indirect -no-window -no-audio -no-boot-anim \
            -no-snapshot -wipe-data -memory 3072 -cores 3 \
            > /tmp/split-emu.log 2>&1 &
          for i in $(seq 1 15); do
            sleep 60
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "[boot-wait minute $i] sys.boot_completed='$BOOT'"
            if [ "$BOOT" = "1" ]; then break; fi
            pgrep -f "emulator.*-avd split-smoke" >/dev/null || { tail -50 /tmp/split-emu.log; exit 43; }
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"

      - name: Install exact default split target and launch
        run: |
          java -jar bundletool.jar install-apks \
            --apks=default-target/termux-app-debug-default.apks \
            --adb="$ANDROID_HOME/platform-tools/adb"
          adb shell pm path com.termux | tee installed-splits.txt
          test "$(grep -c '^package:' installed-splits.txt)" -gt 1
          adb shell am start -W -n com.termux/.app.TermuxActivity
          sleep 20
          adb shell dumpsys activity activities | grep -E 'topResumedActivity|com.termux'
          adb exec-out screencap -p > split-render.png
          adb logcat -d | grep -iE 'FATAL|AndroidRuntime.*com.termux' | tail -20 || true

      - name: Assert split render
        run: |
          python3 -m pip install --quiet Pillow
          python3 .github/workflows/assert_render.py split-render.png

      - name: Install exact fused universal target and verify feature routing
        run: |
          mkdir -p fused
          unzip -o universal-target/termux-app-debug-universal.apks universal.apk -d fused
          adb uninstall com.termux >/dev/null 2>&1 || true
          adb install -r fused/universal.apk
          adb shell pm path com.termux | tee fused-pm-path.txt
          test "$(grep -c '^package:' fused-pm-path.txt)" -eq 1
          adb shell am start -W -n com.termux/.app.TermuxActivity
          sleep 15
          adb shell am start -W -a com.termux.action.OPEN_SETTINGS
          sleep 5
          adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' | tee fused-focus.txt
          grep -q SettingsActivity fused-focus.txt
          adb exec-out screencap -p > fused-settings.png
          adb shell cmd package resolve-activity -a com.termux.action.OPEN_HELP | tee fused-resolve.txt
          grep -q 'HelpActivity' fused-resolve.txt
          if adb shell am start -W -a com.termux.action.OPEN_HELP 2>&1 | tee fused-help-denied.txt | grep -qE 'SecurityException|unable to resolve|Activity not started'; then
            echo "HELP_EXPORTED_FALSE_ENFORCED_POST_FUSE"
          else
            echo "FAIL: HelpActivity was externally startable (exported flag lost during fuse)"
            cat fused-help-denied.txt
            exit 1
          fi
          adb logcat -d | grep -iE 'FATAL|AndroidRuntime.*com.termux' | tail -20 || true

      - name: Upload split emulator evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: signed-apks-emulator-evidence
          path: |
            split-render.png
            installed-splits.txt
            /tmp/split-emu.log
            fused-pm-path.txt
            fused-focus.txt
            fused-resolve.txt
            fused-help-denied.txt
            fused-settings.png
          if-no-files-found: warn

      - name: Kill emulator
        if: always()
        run: adb emu kill || pkill -f qemu-system || true
