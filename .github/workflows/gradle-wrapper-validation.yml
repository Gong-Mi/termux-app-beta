name: "Validate Gradle Wrapper"

on:
  push:
    branches:
      - master
      - android-10
    paths:
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/gradle-wrapper-validation.yml'
  pull_request:
    branches:
      - master
      - android-10
    paths:
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/gradle-wrapper-validation.yml'

jobs:
  validation:
    name: "Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v5
