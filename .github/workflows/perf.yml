name: Perf (terminal emulator, x86_64 + aarch64)

on:
  push:
    branches: [ master ]
    paths:
      - 'terminal-emulator/**'
      - 'terminal-view/**'
      - 'buildSrc/**'
      - 'scripts/**'
      - '*.gradle'
      - '*.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/perf.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'terminal-emulator/**'
      - 'terminal-view/**'
      - 'buildSrc/**'
      - 'scripts/**'
      - '*.gradle'
      - '*.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/perf.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: 21

jobs:
  perf:
    name: Perf (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      # ubuntu-24.04-arm images do not ship a preinstalled Android SDK
      # (x86 images do). cmdline-tools are JVM jars and run fine on aarch64.
      - name: Set up Android SDK (ARM64 runner)
        if: runner.arch == 'ARM64'
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      # Terminal-emulator parse/input test classes: ANSI parser
      # (TerminalTest), UTF-8/Unicode input (UnicodeInputTest), CSI
      # sequences (ControlSequenceIntroducerTest), the ByteQueue the
      # async parsing HandlerThread drains, plus key/screen/scroll/resize.
      # TERMUX_TEST_PERF_MODE=1 makes TerminalTestCase skip its O(screen)
      # assertInvariants checks so timings reflect engine cost, not test
      # scaffolding (TerminalTestCase.java sPerfMode).
      - name: Run terminal-emulator parse/input unit tests
        run: |
          TERMUX_TEST_PERF_MODE=1 ./gradlew :terminal-emulator:testDebugUnitTest \
            --tests "com.termux.terminal.TerminalTest" \
            --tests "com.termux.terminal.UnicodeInputTest" \
            --tests "com.termux.terminal.ControlSequenceIntroducerTest" \
            --tests "com.termux.terminal.ByteQueueTest" \
            --tests "com.termux.terminal.KeyHandlerTest" \
            --tests "com.termux.terminal.ScreenBufferTest" \
            --tests "com.termux.terminal.ScrollRegionTest" \
            --tests "com.termux.terminal.ResizeTest" \
            --tests "com.termux.terminal.PerfBenchmarkTest" \
            --info

      - name: Extract timing from JUnit XML reports
        run: python3 .github/workflows/perf_extract_timing.py ${{ matrix.arch }} perf-timing-${{ matrix.arch }}.txt

      # Fail the job on structural perf regressions (e.g. reintroducing the
      # O(columns^2) row scans or per-code-point width binary search).
      - name: Check tracked benchmark budgets
        run: python3 .github/workflows/perf_check_thresholds.py perf-timing-${{ matrix.arch }}.txt

      - name: Upload timing artifact
        uses: actions/upload-artifact@v6
        with:
          name: perf-timing-${{ matrix.arch }}
          path: perf-timing-${{ matrix.arch }}.txt
          if-no-files-found: error

      - name: Upload baseline timing artifact on master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v6
        with:
          name: perf-timing-baseline-${{ matrix.arch }}
          path: perf-timing-${{ matrix.arch }}.txt
          if-no-files-found: error

  compare:
    name: Compare x86_64 vs aarch64 and PR vs baseline
    needs: perf
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download x86_64 timing
        uses: actions/download-artifact@v6
        with:
          name: perf-timing-x86_64
          path: timings/x86_64

      - name: Download aarch64 timing
        uses: actions/download-artifact@v6
        with:
          name: perf-timing-aarch64
          path: timings/aarch64

      - name: Find latest master baseline run
        id: baseline-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/perf.yml/runs?branch=master&status=success&per_page=1" \
            --jq '.workflow_runs[0].id' 2>/dev/null || true)
          echo "baseline run_id=${RUN_ID:-none}"
          echo "run_id=${RUN_ID:-}" >> "$GITHUB_OUTPUT"

      - name: Download baseline x86_64 timing
        id: baseline-x86_64
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: perf-timing-baseline-x86_64
          path: timings/baseline-x86_64
          run-id: ${{ steps.baseline-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download baseline aarch64 timing
        id: baseline-aarch64
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: perf-timing-baseline-aarch64
          path: timings/baseline-aarch64
          run-id: ${{ steps.baseline-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Print comparison tables
        env:
          BASELINE_RUN_ID: ${{ steps.baseline-run.outputs.run_id }}
        run: |
          python3 - <<'EOF'
          import glob

          def parse(path):
              d = {}
              section = False
              with open(path) as f:
                  for line in f:
                      if "per test class" in line:
                          section = True
                          continue
                      if "individual tests" in line:
                          section = False
                      if not section or not line.startswith("  "):
                          continue
                      parts = line.strip().split()
                      if len(parts) == 2 and parts[1].endswith("s") and \
                              parts[1][:-1].replace(".", "").isdigit():
                          d[parts[0]] = float(parts[1][:-1])
              return d

          def load_single(pattern):
              files = glob.glob(pattern)
              return parse(files[0]) if files else {}

          x86 = load_single("timings/x86_64/perf-timing-*.txt")
          arm = load_single("timings/aarch64/perf-timing-*.txt")
          base_x86 = load_single("timings/baseline-x86_64/perf-timing-*.txt")
          base_arm = load_single("timings/baseline-aarch64/perf-timing-*.txt")
          base_run_label = __import__("os").environ.get("BASELINE_RUN_ID", "unknown")

          print("per test class wall time: x86_64 vs aarch64 (lower is better)")
          print(f"{'test class':60s} {'x86_64':>10s} {'aarch64':>10s} {'x86/arm':>8s}")
          for cls in sorted(set(x86) | set(arm), key=lambda c: -max(x86.get(c, 0), arm.get(c, 0))):
              xv, av = x86.get(cls, 0.0), arm.get(cls, 0.0)
              ratio = f"{xv / av:.2f}x" if av > 0 else "n/a"
              print(f"{cls:60s} {xv:8.3f}s {av:8.3f}s {ratio:>8s}")

          total_x = sum(x86.values())
          total_a = sum(arm.values())
          print(f"\nsuite wall total: x86_64={total_x:.3f}s aarch64={total_a:.3f}s "
                f"ratio={total_x/total_a:.2f}x" if total_a > 0 else "")

          if base_x86 or base_arm:
              print(f"\\nPR vs master baseline (baseline run: {base_run_label}, negative = faster than baseline)")
              print(f"{'test class':60s} {'arch':>8s} {'pr':>10s} {'baseline':>10s} {'delta':>10s}")
              for cls in sorted(set(x86) | set(arm)):
                  for label, current, baseline in [
                      ("x86_64", x86.get(cls), base_x86.get(cls)),
                      ("aarch64", arm.get(cls), base_arm.get(cls)),
                  ]:
                      if current is None or baseline is None:
                          continue
                      delta = current - baseline
                      delta_pct = delta / baseline * 100 if baseline else 0
                      marker = "↑" if delta > 0.01 else ("↓" if delta < -0.01 else "=")
                      print(f"{cls:60s} {label:>8s} {current:8.3f}s {baseline:8.3f}s {delta:+8.3f}s ({delta_pct:+5.1f}%) {marker}")
          else:
              print("\nNo master baseline artifact found; skipping PR vs baseline comparison.")
          EOF

      - name: Upload combined timing artifact
        uses: actions/upload-artifact@v6
        with:
          name: perf-timing-combined
          path: |
            timings/x86_64/*.txt
            timings/aarch64/*.txt
          if-no-files-found: error
